name: Publish homepage

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: homepage-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       github.event.sender.login == github.repository_owner &&
       contains(github.event.issue.body, '### 主页文字'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Save submitted content
        if: github.event_name == 'issues'
        run: |
          python3 scripts/update_content.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/content.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update homepage from submitted form' -m 'Save the repository owner’s submitted text as the homepage content. The same workflow builds and publishes the updated static page without requiring another workflow trigger.'
            git push origin HEAD:main
          fi
      - name: Build static homepage
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
