<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人主页 · 编辑示例</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #242526; font: 17px/1.8 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 72px 24px; }
    .label { margin: 0 0 12px; color: #737373; font-size: 14px; }
    h1 { margin: 0 0 32px; font-size: 30px; font-weight: 500; }
    #homepage-content { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    footer { margin-top: 48px; border-top: 1px solid #ddd; padding-top: 18px; color: #737373; font-size: 14px; }
    footer p { margin: 0 0 12px; }
    nav { display: flex; flex-wrap: wrap; gap: 12px 24px; }
    a { color: #7d2836; text-underline-offset: 4px; }
    @media (max-width: 480px) { main { padding-top: 40px; } }
  </style>
</head>
<body>
  <main>
    <p class="label">编辑示例</p>
    <h1>个人主页</h1>
    <p id="homepage-content"><!-- CONTENT --></p>
    <footer>
      <p>最近更新：<time><!-- UPDATED --></time></p>
      <nav aria-label="主页管理">
        <a href="https://github.com/summertree996/pages-editor-demo/issues/new?template=update-homepage.yml">编辑主页文字</a>
        <a href="https://github.com/summertree996/pages-editor-demo/actions">发布进度</a>
      </nav>
    </footer>
  </main>
</body>
</html>
